name: Deploy maven on ec2 with self hosted

on:
  push:
    branches: [ "AWS-infrastructure" ]
  pull_request:
    branches: [ "AWS-infrastructure" ]

env:
  DOCKER_IMAGE_NAME: simple-java-maven-app
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: simple-java-app

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to ECR
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build the Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:1.0.${{ github.run_number }}
        build-args: |
          APP_VERSION=1.0.${{ github.run_number }}

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_SERVER }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop my-app || true
          docker rm my-app || true
          docker run -d \
            --name my-app \
            ${{ secrets.DOCKER_HUB_USER }}/${{ env.ECR_REPOSITORY }}:1.0.${{ github.run_number }}
















    
