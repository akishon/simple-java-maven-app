name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  DOCKER_IMAGE_NAME: simple-java-maven-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
    - name: Build the Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USER }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          ${{ secrets.DOCKER_HUB_USER }}/${{ env.DOCKER_IMAGE_NAME }}:1.0.${{ github.run_number }}
        build-args: |
          APP_VERSION=1.0.${{ github.run_number }}


  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: applelboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SERVER }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script:
            docker stop my-app || true
            docker rm my-app || true
            docker run -d --pull=always ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.DOCKER_HUB_USERNAME }}:1.0.${{ github.run_number }}
            



















    
